version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: threat_detection
      POSTGRES_USER: threat_admin
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Optional, for distributed setups)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Threat Detection API
  api:
    build: .
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://threat_admin:secure_password_change_me@db:5432/threat_detection
      SECRET_KEY: your-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5000
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./backend:/app/backend
    restart: unless-stopped
    networks:
      - threat_network

  # Frontend (Optional Nginx reverse proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - threat_network

volumes:
  postgres_data:
    driver: local

networks:
  threat_network:
    driver: bridge
